# Cars Radar relay (MediaMTX v1.21). Unlisted settings keep MediaMTX defaults.
# The phone publishes to path "live/cam" (SRT or RTMP); the backend reads the same path over RTSP.
#   phone, SRT:              srt://<LAPTOP_IP>:8890?streamid=publish:live/cam
#   phone, RTMP:             rtmp://<LAPTOP_IP>:1935/live  with stream key "cam"
#   backend / VLC / ffplay:  rtsp://127.0.0.1:8554/live/cam

logLevel: info

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

srt: true
srtAddress: :8890

# RTMP adds 1-3 s of latency over SRT but is the most widely supported by phone apps.
rtmp: true
rtmpAddress: :1935

hls: false
webrtc: false
moq: false

pathDefaults:
  # Set to true to keep the raw phone stream for re-processing (e.g. re-reading plates offline).
  record: false
  recordPath: ../data/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordSegmentDuration: 10m
  recordDeleteAfter: 7d

paths:
  live/cam:
    source: publisher
